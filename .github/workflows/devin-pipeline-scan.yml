#
# Trigger 1 of 3: scheduled scan. Runs the detectors against the checkout and
# files (or refreshes) one issue per finding. Filing is idempotent by
# fingerprint, so a nightly run never duplicates yesterday's issues.
name: devin-pipeline / scan

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated detector names (blank = all)"
        required: false
      dry_run:
        description: "Detect without writing to GitHub"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: pip install -r devin_pipeline/requirements.txt
      - name: Detect and file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          REPO_PATH: ${{ github.workspace }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ONLY: ${{ inputs.only }}
        run: |
          python -m devin_pipeline.pipeline.cli file ${ONLY:+--only ${ONLY}}
