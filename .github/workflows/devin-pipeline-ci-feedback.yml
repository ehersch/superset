#
# Trigger 3 of 3: CI on a Devin-authored pull request went red. The failures
# are sent back into the session that opened the PR, so the agent keeps its
# context and its branch instead of starting over. The retry budget is
# enforced in the pipeline, not here.
name: devin-pipeline / ci-feedback

on:
  check_suite:
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: devin-pipeline-state
  cancel-in-progress: false

jobs:
  feedback:
    if: >
      github.event.check_suite.conclusion == 'failure' &&
      github.event.check_suite.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r devin_pipeline/requirements.txt
      - run: bash devin_pipeline/scripts/state_sync.sh pull
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Feed failures back to the owning session
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.check_suite.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          python -m devin_pipeline.pipeline.cli ci-failure \
            --pr-url "https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}"
      - if: always()
        run: bash devin_pipeline/scripts/state_sync.sh push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
